[snippets]
include_default_snippets = true
custom_paths = []

[experimental]

[diagnostics]
sql_linter = true

[formatting]
line_length = 80

[package_management]
manager = "uv"

[language_servers.basedpyright]
enabled = false

[language_servers.pylsp]
enable_pydocstyle = false
enable_ruff = true
enabled = true
enable_pyflakes = false
enable_mypy = true
enable_flake8 = false
enable_pylint = false

[language_servers.ty]
enabled = false

[completion]
activate_on_typing = true
copilot = false

[display]
code_editor_font_size = 17
default_width = "full"
default_table_page_size = 10
default_table_max_columns = 50
dataframes = "rich"
cell_output = "below"
theme = "dark"
reference_highlighting = true

[keymap]
destructive_delete = true
preset = "vim"

[keymap.overrides]

[ai]
rules = ""
mode = "manual"
inline_tooltip = false

[ai.models]
displayed_models = []
custom_models = []

[save]
format_on_save = true
autosave = "after_delay"
autosave_delay = 5000

[server]
follow_symlink = false
browser = "default"

[runtime]
default_sql_output = "auto"
watcher_on_save = "lazy"
dotenv = []
default_auto_download = []
std_stream_max_bytes = 1000000
on_cell_change = "autorun"
reactive_tests = true
output_max_bytes = 8000000
auto_reload = "lazy"
auto_instantiate = true

[mcp]
presets = []

[mcp.mcpServers]
